[package]
name = "ermis-call-node-wasm"
version = "0.1.0"
edition = "2024"
default-run = "cli"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cli"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.86"
async-channel = "2.3.1"
clap = { version = "4.5.30", features = ["derive"], optional = true }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3", features = ["wasm_js"] }
iroh = { version = "0.94", default-features = false }
n0-future = "0.3"
serde = "1.0.217"
serde-wasm-bindgen = "0.6.5"
tokio = { version = "1.43.0", default-features = false, features = ["sync"] }
tokio-stream = { version = "0.1.17", default-features = false, features = ["sync"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-subscriber-wasm = "0.1.0"
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "0.4.50"
wasm-streams = "0.4.2"

base64 = "0.22.1"
bitcode = { version = "0.6.7", features = ["serde"] }
flume = "0.11.1"
bytes = "1.6.0"
tokio-util = { version = "0.7.17", features = ["codec"] }
futures = "0.3.31"
iroh-quinn-proto = "0.13.0"

[features]
cli = ["tokio/full", "dep:clap"]



[profile.release]
codegen-units = 1
strip = "symbols"
debug = false
lto = true
opt-level = "z"
panic = 'abort'
